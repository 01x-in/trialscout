<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrialScout</title>
    <script>
      // The viewer's light or dark pick (src/theme.ts), before the first paint so the other
      // theme never flashes. Nothing else is read from storage here.
      try {
        const theme = localStorage.getItem('trialscout.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
